
spring:
  application:
    name: focusboard-backend

  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/focusboard_db
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never
app:
  security:
    admin-email: ${ADMIN_EMAIL:}