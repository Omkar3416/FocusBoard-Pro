
spring:
  application:
    name: focusboard-backend

  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/focusboard_db
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:}

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never
app:
  security:
    owner-bootstrap-secret: ${OWNER_BOOTSTRAP_SECRET:}